<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Abhiram Shaji">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07030f"/>
      <stop offset="0.55" stop-color="#12042a"/>
      <stop offset="1" stop-color="#2a0538"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" fill="url(#sky)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>
  <g stroke="#ff2bd1" stroke-opacity="0.22" stroke-width="1">
    <path d="M0 240 L500 150 L1000 240"/>
    <path d="M120 240 L500 150"/>
    <path d="M880 240 L500 150"/>
  </g>
  <circle cx="820" cy="70" r="34" fill="none" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.5" filter="url(#soft)"/>
  <circle cx="820" cy="70" r="52" fill="none" stroke="#ff2bd1" stroke-opacity="0.28" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="86" font-size="15" fill="#00f0ff" fill-opacity="0.75" letter-spacing="7">SOLUTIONS ARCHITECT III / BOTPRESS</text>
    <text x="58" y="152" font-size="54" font-weight="700" fill="#ff2bd1" fill-opacity="0.55" filter="url(#glow)" letter-spacing="4">ABHIRAM SHAJI</text>
    <text x="60" y="150" font-size="54" font-weight="700" fill="#eafcff" filter="url(#soft)" letter-spacing="4">ABHIRAM SHAJI
      <animate attributeName="fill-opacity" values="1;0.82;1;0.95;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="62" y="192" font-size="16" fill="#8be9fd" fill-opacity="0.8" letter-spacing="2">forward deployed: on the client call, then in the production code</text>
  </g>

  <rect x="60" y="208" width="880" height="2" fill="url(#rule)" filter="url(#soft)"/>
</svg>
